<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background-color:#0d1b2a; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <pattern id="grid-pattern-0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a47" stroke-width="1" />
    </pattern>
    <linearGradient id="wall-grad-0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152b47" />
    </linearGradient>
  </defs>

  <!-- Blueprint Grid Background -->
  <rect width="1000" height="600" fill="url(#grid-pattern-0)" />

  <!-- Outer Walls -->
  <rect x="40" y="40" width="920" height="520" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />

  <!-- Blueprint Title Header Block -->
  <rect x="50" y="50" width="300" height="55" rx="6" fill="#132338" stroke="#0284c7" stroke-width="1.5" />
  <text x="65" y="75" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">CAMPUS BLUEPRINT // MAIN BUILDING</text>
  <text x="65" y="93" fill="#94a3b8" font-size="12">LEVEL 0 : GROUND FLOOR ENTRANCE &amp; SERVICES</text>

  <!-- Compass / North Indicator -->
  <g transform="translate(900, 85)">
    <circle cx="0" cy="0" r="22" fill="#132338" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="0,-18 5,0 -5,0" fill="#38bdf8" />
    <polygon points="0,18 5,0 -5,0" fill="#64748b" />
    <text x="-4" y="-22" fill="#38bdf8" font-size="10" font-weight="bold">N</text>
  </g>

  <!-- Main Entrance Vestibule -->
  <rect x="420" y="40" width="160" height="80" fill="#102033" stroke="#38bdf8" stroke-width="2" />
  <text x="500" y="85" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">MAIN ENTRANCE</text>

  <!-- Central Lobby -->
  <rect x="250" y="140" width="500" height="150" fill="#102033" stroke="#0ea5e9" stroke-dasharray="6,4" stroke-width="1" />
  <text x="500" y="220" fill="#64748b" font-size="13" font-weight="bold" letter-spacing="3" text-anchor="middle">CAMPUS ATRIUM &amp; CENTRAL LOBBY</text>

  <!-- Room G-01: Admission Cell (around 28%, 45%) -> (x: 280, y: 270) -->
  <rect x="80" y="160" width="220" height="200" rx="4" fill="#183652" stroke="#0ea5e9" stroke-width="2.5" />
  <rect x="90" y="170" width="200" height="180" fill="#1c4468" opacity="0.6" />
  <text x="190" y="250" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">ADMISSION CELL</text>
  <text x="190" y="270" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">ROOM G-01</text>
  <text x="190" y="290" fill="#7dd3fc" font-size="10" text-anchor="middle">Admissions, Fees &amp; Verification</text>

  <!-- Security & Visitor Desk -->
  <rect x="80" y="380" width="220" height="130" fill="url(#wall-grad-0)" stroke="#38bdf8" stroke-width="2" />
  <text x="190" y="440" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room G-02</text>
  <text x="190" y="460" fill="#94a3b8" font-size="11" text-anchor="middle">Campus Security &amp; Help Desk</text>

  <!-- Administration Offices -->
  <rect x="330" y="340" width="220" height="170" fill="url(#wall-grad-0)" stroke="#38bdf8" stroke-width="2" />
  <text x="440" y="420" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room G-03</text>
  <text x="440" y="440" fill="#94a3b8" font-size="11" text-anchor="middle">Registrar &amp; Accounts</text>

  <!-- Medical Room -->
  <rect x="570" y="340" width="130" height="170" fill="url(#wall-grad-0)" stroke="#38bdf8" stroke-width="2" />
  <text x="635" y="420" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room G-04</text>
  <text x="635" y="440" fill="#94a3b8" font-size="11" text-anchor="middle">Infirmary</text>

  <!-- Room G-05: Cafeteria & Dining (around 80%, 75%) -> (x: 800, y: 450) -->
  <rect x="720" y="200" width="240" height="310" rx="4" fill="#183652" stroke="#0ea5e9" stroke-width="2.5" />
  <rect x="730" y="210" width="220" height="290" fill="#1c4468" opacity="0.6" />
  <text x="840" y="360" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle">CAMPUS CAFETERIA</text>
  <text x="840" y="385" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">ROOM G-05</text>
  <text x="840" y="405" fill="#7dd3fc" font-size="10" text-anchor="middle">Dining Commons &amp; Refreshments</text>

  <!-- Scale Ruler -->
  <g transform="translate(80, 530)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#38bdf8" stroke-width="2" />
    <line x1="200" y1="-5" x2="200" y2="5" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="16" fill="#94a3b8" font-size="10">0m</text>
    <text x="90" y="16" fill="#94a3b8" font-size="10">15m</text>
    <text x="190" y="16" fill="#94a3b8" font-size="10">30m</text>
  </g>
</svg>
