<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background-color:#0d1b2a; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <pattern id="grid-pattern-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a47" stroke-width="1" />
    </pattern>
    <linearGradient id="wall-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152b47" />
    </linearGradient>
  </defs>

  <!-- Blueprint Grid Background -->
  <rect width="1000" height="600" fill="url(#grid-pattern-1)" />

  <!-- Outer Walls -->
  <rect x="40" y="40" width="920" height="520" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />

  <!-- Blueprint Title Header Block -->
  <rect x="50" y="50" width="300" height="55" rx="6" fill="#132338" stroke="#0284c7" stroke-width="1.5" />
  <text x="65" y="75" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">CAMPUS BLUEPRINT // MAIN BUILDING</text>
  <text x="65" y="93" fill="#94a3b8" font-size="12">LEVEL 1 : FIRST FLOOR LAYOUT &amp; ACADEMIC WING</text>

  <!-- Compass / North Indicator -->
  <g transform="translate(900, 85)">
    <circle cx="0" cy="0" r="22" fill="#132338" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="0,-18 5,0 -5,0" fill="#38bdf8" />
    <polygon points="0,18 5,0 -5,0" fill="#64748b" />
    <text x="-4" y="-22" fill="#38bdf8" font-size="10" font-weight="bold">N</text>
  </g>

  <!-- Central Corridor -->
  <rect x="80" y="270" width="840" height="70" fill="#102033" stroke="#0ea5e9" stroke-dasharray="6,4" stroke-width="1" />
  <text x="500" y="310" fill="#64748b" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle">CENTRAL CORRIDOR (FIRST FLOOR)</text>

  <!-- Top Wing - West Lecture Halls -->
  <rect x="80" y="120" width="180" height="130" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="170" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Hall 1-03</text>
  <text x="170" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Lecture Theatre</text>

  <rect x="280" y="120" width="130" height="130" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="345" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-02</text>
  <text x="345" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Faculty Lounge</text>

  <!-- Central Library Block (Room 1-01) around (52%, 38%) -> (x: 520, y: 228) -->
  <rect x="430" y="120" width="220" height="130" rx="4" fill="#183652" stroke="#0ea5e9" stroke-width="2.5" />
  <rect x="440" y="130" width="200" height="110" fill="#1c4468" opacity="0.6" />
  <text x="540" y="175" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">CENTRAL LIBRARY</text>
  <text x="540" y="195" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">ROOM 1-01</text>
  <text x="540" y="215" fill="#7dd3fc" font-size="10" text-anchor="middle">Reference &amp; Study Commons</text>

  <!-- East Labs & Dean Office -->
  <rect x="670" y="120" width="120" height="130" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="730" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-04</text>
  <text x="730" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Seminar Room</text>

  <rect x="810" y="120" width="110" height="130" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="865" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-05</text>
  <text x="865" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Dean Office</text>

  <!-- Bottom Wing Classrooms & Facilities -->
  <rect x="80" y="360" width="220" height="150" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="190" y="430" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-06</text>
  <text x="190" y="450" fill="#94a3b8" font-size="11" text-anchor="middle">Digital Archive</text>

  <rect x="320" y="360" width="180" height="150" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="410" y="430" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-07</text>
  <text x="410" y="450" fill="#94a3b8" font-size="11" text-anchor="middle">Classroom A</text>

  <rect x="520" y="360" width="180" height="150" fill="url(#wall-grad-1)" stroke="#38bdf8" stroke-width="2" />
  <text x="610" y="430" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Room 1-08</text>
  <text x="610" y="450" fill="#94a3b8" font-size="11" text-anchor="middle">Classroom B</text>

  <!-- Stairs & Elevators -->
  <rect x="720" y="360" width="200" height="150" fill="#132338" stroke="#38bdf8" stroke-width="2" />
  <text x="820" y="430" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">STAIRCASE &amp; LIFTS</text>
  <text x="820" y="450" fill="#64748b" font-size="11" text-anchor="middle">Vertical Transit Core</text>

  <!-- Scale Ruler -->
  <g transform="translate(80, 530)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#38bdf8" stroke-width="2" />
    <line x1="200" y1="-5" x2="200" y2="5" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="16" fill="#94a3b8" font-size="10">0m</text>
    <text x="90" y="16" fill="#94a3b8" font-size="10">15m</text>
    <text x="190" y="16" fill="#94a3b8" font-size="10">30m</text>
  </g>
</svg>
