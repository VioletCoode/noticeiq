<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background-color:#0d1b2a; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <pattern id="grid-pattern-2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a47" stroke-width="1" />
    </pattern>
    <linearGradient id="wall-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#152b47" />
    </linearGradient>
  </defs>

  <!-- Blueprint Grid Background -->
  <rect width="1000" height="600" fill="url(#grid-pattern-2)" />

  <!-- Outer Walls -->
  <rect x="40" y="40" width="920" height="520" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />

  <!-- Blueprint Title Header Block -->
  <rect x="50" y="50" width="300" height="55" rx="6" fill="#132338" stroke="#0284c7" stroke-width="1.5" />
  <text x="65" y="75" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">CAMPUS BLUEPRINT // MAIN BUILDING</text>
  <text x="65" y="93" fill="#94a3b8" font-size="12">LEVEL 2 : SECOND FLOOR LABS &amp; CAREER COMPLEX</text>

  <!-- Compass / North Indicator -->
  <g transform="translate(900, 85)">
    <circle cx="0" cy="0" r="22" fill="#132338" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="0,-18 5,0 -5,0" fill="#38bdf8" />
    <polygon points="0,18 5,0 -5,0" fill="#64748b" />
    <text x="-4" y="-22" fill="#38bdf8" font-size="10" font-weight="bold">N</text>
  </g>

  <!-- Central Corridor -->
  <rect x="80" y="270" width="840" height="70" fill="#102033" stroke="#0ea5e9" stroke-dasharray="6,4" stroke-width="1" />
  <text x="500" y="310" fill="#64748b" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle">CENTRAL CORRIDOR (SECOND FLOOR)</text>

  <!-- Top Wing Labs -->
  <rect x="80" y="120" width="260" height="130" fill="url(#wall-grad-2)" stroke="#38bdf8" stroke-width="2" />
  <text x="210" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Hardware Lab 2-02</text>
  <text x="210" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">IoT &amp; Embedded Systems</text>

  <rect x="360" y="120" width="260" height="130" fill="url(#wall-grad-2)" stroke="#38bdf8" stroke-width="2" />
  <text x="490" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Software Lab 2-03</text>
  <text x="490" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">Cloud Computing Wing</text>

  <rect x="640" y="120" width="280" height="130" fill="url(#wall-grad-2)" stroke="#38bdf8" stroke-width="2" />
  <text x="780" y="180" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">Research Lab 2-05</text>
  <text x="780" y="200" fill="#94a3b8" font-size="11" text-anchor="middle">AI &amp; Neural Nets</text>

  <!-- Bottom Wing: Stairs & Placement Cell around (42%, 58%) -> (x: 420, y: 348 - 400) -->
  <rect x="80" y="360" width="200" height="150" fill="#132338" stroke="#38bdf8" stroke-width="2" />
  <text x="180" y="430" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">STAIRCASE &amp; LIFTS</text>
  <text x="180" y="450" fill="#64748b" font-size="11" text-anchor="middle">Vertical Transit Core</text>

  <!-- Room 2-04: Placement & Career Cell (around 42%, 58%) -->
  <rect x="300" y="360" width="240" height="150" rx="4" fill="#183652" stroke="#0ea5e9" stroke-width="2" />
  <rect x="310" y="370" width="220" height="130" fill="#1c4468" opacity="0.5" />
  <text x="420" y="425" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">PLACEMENT &amp; CAREER CELL</text>
  <text x="420" y="445" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">ROOM 2-04</text>
  <text x="420" y="465" fill="#7dd3fc" font-size="10" text-anchor="middle">Training &amp; Interviews Suite</text>

  <!-- Room 2-01: Computer Lab 1 (Python Lab) around (74.5%, 62%) -> (x: 745, y: 372) -->
  <rect x="560" y="360" width="360" height="150" rx="4" fill="#183652" stroke="#0ea5e9" stroke-width="2.5" />
  <rect x="570" y="370" width="340" height="130" fill="#1c4468" opacity="0.6" />
  <text x="740" y="425" fill="#38bdf8" font-size="15" font-weight="900" text-anchor="middle">COMPUTER LAB 1 (PYTHON LAB)</text>
  <text x="740" y="445" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle">ROOM 2-01</text>
  <text x="740" y="465" fill="#7dd3fc" font-size="10" text-anchor="middle">High Performance Programming Lab</text>

  <!-- Scale Ruler -->
  <g transform="translate(80, 530)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#38bdf8" stroke-width="2" />
    <line x1="200" y1="-5" x2="200" y2="5" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="16" fill="#94a3b8" font-size="10">0m</text>
    <text x="90" y="16" fill="#94a3b8" font-size="10">15m</text>
    <text x="190" y="16" fill="#94a3b8" font-size="10">30m</text>
  </g>
</svg>
